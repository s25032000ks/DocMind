spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    google:
      genai:
        api-key: ${GEMINI_API_KEY_DOCMIND}
        chat:
          options:
            model: gemini-3.1-flash-lite
            temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY_DOCMIND}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
            dimensions: 1536

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB